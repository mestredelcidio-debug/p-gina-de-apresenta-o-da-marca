<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <!-- Background Vignette Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#07223f" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#031122" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#020710" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Intense Neon Cyan Filters -->
    <filter id="neonGlowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feGaussianBlur stdDeviation="18" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.8" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Typography & Lettering -->
    <linearGradient id="textCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E0F7FE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 3D Bevel Gradient for Letters D and G -->
    <linearGradient id="letter3DGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FE"/>
      <stop offset="30%" stop-color="#7DD3FC"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#03487A"/>
    </linearGradient>

    <linearGradient id="letterStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>

    <!-- Puzzle Frame Gradient -->
    <linearGradient id="puzzleBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Black Background with Cyan Center Ambiance -->
  <rect width="900" height="900" fill="#000000"/>
  <circle cx="450" cy="450" r="420" fill="url(#bgGlow)"/>

  <!-- ==================== HEADER TYPOGRAPHY ==================== -->
  <g id="brand-header-text" filter="url(#neonGlowIntense)">
    <!-- DECIX Main Wordmark -->
    <text x="450" y="275"
          text-anchor="middle"
          fill="url(#textCyanGrad)"
          stroke="#00D2FF"
          stroke-width="3"
          stroke-linejoin="round"
          font-family="system-ui, -apple-system, 'Segoe UI', 'Montserrat', 'Syne', sans-serif"
          font-size="114"
          font-weight="900"
          letter-spacing="9px">DECIX</text>

    <!-- GAMERS Secondary Wordmark -->
    <text x="450" y="340"
          text-anchor="middle"
          fill="#38BDF8"
          stroke="#00E5FF"
          stroke-width="1.5"
          font-family="system-ui, -apple-system, 'Segoe UI', 'Montserrat', sans-serif"
          font-size="44"
          font-weight="800"
          letter-spacing="18px">GAMERS</text>
  </g>

  <!-- Extra outer ambient glow for header text -->
  <g opacity="0.6" filter="url(#neonAura)" pointer-events="none">
    <text x="450" y="275"
          text-anchor="middle"
          fill="none"
          stroke="#00D2FF"
          stroke-width="6"
          font-family="system-ui, -apple-system, 'Segoe UI', 'Montserrat', sans-serif"
          font-size="114"
          font-weight="900"
          letter-spacing="9px">DECIX</text>
  </g>

  <!-- ==================== EMBLEM: PUZZLE & GAMING ==================== -->
  <g id="brand-emblem" transform="translate(0, 40)">

    <!-- PUZZLE PIECE CONTOUR (Main glowing perimeter) -->
    <!-- Path traces a rounded jigsaw block with tabs: top bulb, right bulb, bottom bulb, left loop -->
    <path d="M 330 460
             H 415
             C 415 440, 420 415, 450 415
             C 480 415, 485 440, 485 460
             H 570
             C 586 460, 600 474, 600 490
             V 525
             C 620 525, 645 530, 645 560
             C 645 590, 620 595, 600 595
             V 630
             C 600 646, 586 660, 570 660
             H 485
             C 485 680, 480 705, 450 705
             C 420 705, 415 680, 415 660
             H 330
             C 314 660, 300 646, 300 630
             V 595
             C 275 595, 255 585, 255 560
             C 255 535, 275 525, 300 525
             V 490
             C 300 474, 314 460, 330 460 Z"
          fill="#030c18"
          fill-opacity="0.85"
          stroke="url(#puzzleBorderGrad)"
          stroke-width="7"
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#neonGlowIntense)" />

    <!-- Secondary outer glow line for puzzle -->
    <path d="M 330 460
             H 415
             C 415 440, 420 415, 450 415
             C 480 415, 485 440, 485 460
             H 570
             C 586 460, 600 474, 600 490
             V 525
             C 620 525, 645 530, 645 560
             C 645 590, 620 595, 600 595
             V 630
             C 600 646, 586 660, 570 660
             H 485
             C 485 680, 480 705, 450 705
             C 420 705, 415 680, 415 660
             H 330
             C 314 660, 300 646, 300 630
             V 595
             C 275 595, 255 585, 255 560
             C 255 535, 275 525, 300 525
             V 490
             C 300 474, 314 460, 330 460 Z"
          fill="none"
          stroke="#00D2FF"
          stroke-width="2.5"
          opacity="0.9" />

    <!-- TOP-LEFT: Crossword Interlocking Puzzle Grid -->
    <g id="crossword-icon" transform="translate(328, 385)">
      <!-- Cross horizontal bar -->
      <rect x="0" y="24" width="70" height="18" rx="3" fill="#021427" stroke="#00D2FF" stroke-width="2"/>
      <!-- Cross vertical bar -->
      <rect x="26" y="0" width="18" height="66" rx="3" fill="#021427" stroke="#00D2FF" stroke-width="2"/>
      
      <!-- Letters in Crossword -->
      <g font-family="monospace" font-size="10" font-weight="900" fill="#38BDF8" text-anchor="middle">
        <text x="35" y="14">C</text>
        <text x="9" y="37">C</text>
        <text x="21" y="37">A</text>
        <text x="35" y="37">L</text>
        <text x="48" y="37">L</text>
        <text x="60" y="37">M</text>
        <text x="35" y="59">I</text>
      </g>
    </g>

    <!-- TOP-RIGHT: Word-Search Letter Grid Matrix -->
    <g id="wordsearch-grid" transform="translate(502, 396)">
      <!-- Grid outer border -->
      <rect x="0" y="0" width="72" height="66" rx="4" fill="#021427" stroke="#00D2FF" stroke-width="2.5"/>
      <!-- Grid lines -->
      <line x1="14" y1="0" x2="14" y2="66" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>
      <line x1="28" y1="0" x2="28" y2="66" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>
      <line x1="42" y1="0" x2="42" y2="66" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>
      <line x1="56" y1="0" x2="56" y2="66" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>

      <line x1="0" y1="13" x2="72" y2="13" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="26" x2="72" y2="26" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="39" x2="72" y2="39" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="52" x2="72" y2="52" stroke="#00D2FF" stroke-width="1" opacity="0.6"/>

      <!-- Matrix Letters (PUORP, PUBOR, PUZEL, etc.) -->
      <g font-family="monospace" font-size="8.5" font-weight="800" fill="#38BDF8" text-anchor="middle">
        <!-- Row 1 -->
        <text x="7" y="10">P</text><text x="21" y="10">U</text><text x="35" y="10">O</text><text x="49" y="10">R</text><text x="64" y="10">P</text>
        <!-- Row 2 -->
        <text x="7" y="23">P</text><text x="21" y="23">U</text><text x="35" y="23">B</text><text x="49" y="23">O</text><text x="64" y="23">R</text>
        <!-- Row 3 -->
        <text x="7" y="36">P</text><text x="21" y="36">U</text><text x="35" y="36">Z</text><text x="49" y="36">E</text><text x="64" y="36">L</text>
        <!-- Row 4 -->
        <text x="7" y="49">A</text><text x="21" y="49">U</text><text x="35" y="49">E</text><text x="49" y="49">L</text><text x="64" y="49">L</text>
        <!-- Row 5 -->
        <text x="7" y="62">N</text><text x="21" y="62">Z</text><text x="35" y="62">L</text><text x="49" y="62">L</text><text x="64" y="62">E</text>
      </g>
    </g>

    <!-- LEFT SIDE: Glowing Magnifying Glass (Search & Word Hunter Icon) -->
    <g id="magnifying-glass" transform="translate(230, 528)" filter="url(#neonGlowIntense)">
      <!-- Lens ring -->
      <circle cx="28" cy="28" r="20" fill="#011020" stroke="#00E5FF" stroke-width="5"/>
      <circle cx="28" cy="28" r="14" fill="#00D2FF" fill-opacity="0.15"/>
      <!-- Lens specular highlight -->
      <path d="M 18 20 A 13 13 0 0 1 34 16" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Handle -->
      <line x1="42" y1="42" x2="60" y2="60" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- CENTER EMBLEM: Big 3D Beveled Letters 'D' and 'G' -->
    <g id="letters-D-G" filter="url(#shadow3D)">
      <!-- Letter D (Left) -->
      <path d="M 330 500
               H 385
               C 425 500, 448 522, 448 558
               C 448 594, 425 616, 385 616
               H 330
               V 500 Z
               M 358 524
               V 592
               H 382
               C 406 592, 420 580, 420 558
               C 420 536, 406 524, 382 524
               H 358 Z"
            fill="url(#letter3DGrad)"
            stroke="url(#letterStrokeGrad)"
            stroke-width="4.5"
            stroke-linejoin="round" />

      <!-- Letter G (Right) -->
      <path d="M 568 532
               C 555 512, 535 500, 508 500
               C 470 500, 445 526, 445 560
               C 445 594, 470 616, 508 616
               C 542 616, 565 598, 568 565
               H 515
               V 545
               H 588
               V 566
               C 584 612, 552 638, 508 638
               C 455 638, 418 602, 418 558
               C 418 514, 455 478, 508 478
               C 545 478, 574 494, 592 520
               L 568 532 Z"
            fill="url(#letter3DGrad)"
            stroke="url(#letterStrokeGrad)"
            stroke-width="4.5"
            stroke-linejoin="round" />
    </g>

    <!-- CENTER 'i' / QUESTION HOOK / KEYHOLE (Between D and G) -->
    <g id="center-inquisitive-i" filter="url(#neonGlowIntense)">
      <!-- Curved upper hook / question curve -->
      <path d="M 436 496
               C 436 476, 464 476, 464 496
               C 464 514, 450 518, 450 534"
            fill="none"
            stroke="#00E5FF"
            stroke-width="4.5"
            stroke-linecap="round"/>
      <!-- Dot of the i / point of question -->
      <circle cx="450" cy="548" r="4" fill="#FFFFFF" stroke="#00E5FF" stroke-width="2"/>
    </g>

    <!-- BOTTOM-CENTER: Glowing Open Book of Puzzles / Words -->
    <g id="open-book-icon" transform="translate(422, 608)" filter="url(#neonGlowIntense)">
      <!-- Left Page -->
      <path d="M 28 28
               C 20 22, 10 20, 0 22
               V 38
               C 10 36, 20 38, 28 44
               Z"
            fill="#031a33"
            stroke="#00E5FF"
            stroke-width="2.5"
            stroke-linejoin="round" />
      <!-- Right Page -->
      <path d="M 28 28
               C 36 22, 46 20, 56 22
               V 38
               C 46 36, 36 38, 28 44
               Z"
            fill="#031a33"
            stroke="#00E5FF"
            stroke-width="2.5"
            stroke-linejoin="round" />
      <!-- Book spine line -->
      <line x1="28" y1="26" x2="28" y2="44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Inner text lines on pages -->
      <path d="M 6 27 C 12 26, 18 27, 23 30" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 6 33 C 12 32, 18 33, 23 36" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 33 30 C 38 27, 44 26, 50 27" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 33 36 C 38 33, 44 32, 50 33" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

  </g>
</svg>
