<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 600 590" width="600" height="590">
  <defs>
    <!-- Background Vignette Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#083864" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#041a33" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#020814" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Intense Neon Cyan Filters -->
    <filter id="neonGlowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="9" result="blur2" />
      <feGaussianBlur stdDeviation="18" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Typography & Lettering -->
    <linearGradient id="textCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E0F7FE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 3D Bevel Gradient for Letters D and G -->
    <linearGradient id="letter3DGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#03487A"/>
    </linearGradient>

    <!-- Puzzle Frame Gradient -->
    <linearGradient id="puzzleBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Black Background with Cyan Center Ambiance -->
  <rect x="150" y="150" width="600" height="590" fill="#000000" rx="32"/>
  <circle cx="450" cy="445" r="285" fill="url(#bgGlow)"/>

  <!-- ==================== HEADER TYPOGRAPHY ==================== -->
  <g id="brand-header-text" filter="url(#neonGlowIntense)">
    <!-- DECIX Main Wordmark -->
    <text x="450" y="275"
          text-anchor="middle"
          fill="url(#textCyanGrad)"
          stroke="#00D2FF"
          stroke-width="3.5"
          stroke-linejoin="round"
          font-family="system-ui, -apple-system, 'Segoe UI', 'Montserrat', 'Syne', sans-serif"
          font-size="118"
          font-weight="900"
          letter-spacing="9px">DECIX</text>

    <!-- GAMERS Secondary Wordmark -->
    <text x="450" y="342"
          text-anchor="middle"
          fill="#38BDF8"
          stroke="#00F0FF"
          stroke-width="2"
          font-family="system-ui, -apple-system, 'Segoe UI', 'Montserrat', sans-serif"
          font-size="46"
          font-weight="900"
          letter-spacing="18px">GAMERS</text>
  </g>

  <!-- Extra outer ambient glow for header text -->
  <g opacity="0.65" filter="url(#neonAura)" pointer-events="none">
    <text x="450" y="275"
          text-anchor="middle"
          fill="none"
          stroke="#00D2FF"
          stroke-width="7"
          font-family="system-ui, -apple-system, 'Segoe UI', 'Montserrat', sans-serif"
          font-size="118"
          font-weight="900"
          letter-spacing="9px">DECIX</text>
  </g>

  <!-- ==================== EMBLEM: PUZZLE & GAMING ==================== -->
  <g id="brand-emblem" transform="translate(0, 36)">

    <!-- PUZZLE PIECE CONTOUR -->
    <path d="M 330 460
             H 415
             C 415 438, 420 412, 450 412
             C 480 412, 485 438, 485 460
             H 570
             C 586 460, 600 474, 600 490
             V 525
             C 620 525, 646 530, 646 560
             C 646 590, 620 595, 600 595
             V 630
             C 600 646, 586 660, 570 660
             H 485
             C 485 682, 480 708, 450 708
             C 420 708, 415 682, 415 660
             H 330
             C 314 660, 300 646, 300 630
             V 595
             C 274 595, 252 585, 252 560
             C 252 535, 274 525, 300 525
             V 490
             C 300 474, 314 460, 330 460 Z"
          fill="#020e1c"
          fill-opacity="0.92"
          stroke="url(#puzzleBorderGrad)"
          stroke-width="7.5"
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#neonGlowIntense)" />

    <!-- TOP-LEFT: Crossword Puzzle -->
    <g id="crossword-grid" transform="translate(326, 382)" filter="url(#neonGlowIntense)">
      <rect x="0" y="24" width="72" height="20" rx="3" fill="#021427" stroke="#00F0FF" stroke-width="2.5"/>
      <rect x="26" y="0" width="20" height="68" rx="3" fill="#021427" stroke="#00F0FF" stroke-width="2.5"/>
      <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" fill="#E0F2FE" text-anchor="middle">
        <text x="36" y="15">C</text>
        <text x="9" y="38">C</text>
        <text x="22" y="38">A</text>
        <text x="36" y="38">L</text>
        <text x="50" y="38">L</text>
        <text x="63" y="38">M</text>
        <text x="36" y="61">I</text>
      </g>
    </g>

    <!-- TOP-RIGHT: Word Search Grid -->
    <g id="wordsearch-grid" transform="translate(502, 394)" filter="url(#neonGlowIntense)">
      <rect x="0" y="0" width="76" height="70" rx="4" fill="#021427" stroke="#00F0FF" stroke-width="2.8"/>
      <line x1="15" y1="0" x2="15" y2="70" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="30" y1="0" x2="30" y2="70" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="45" y1="0" x2="45" y2="70" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="60" y1="0" x2="60" y2="70" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="0" y1="14" x2="76" y2="14" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="0" y1="28" x2="76" y2="28" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="0" y1="42" x2="76" y2="42" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <line x1="0" y1="56" x2="76" y2="56" stroke="#00D2FF" stroke-width="1.2" opacity="0.7"/>
      <g font-family="monospace" font-size="9" font-weight="900" fill="#E0F2FE" text-anchor="middle">
        <text x="7.5" y="11">P</text><text x="22.5" y="11">U</text><text x="37.5" y="11">O</text><text x="52.5" y="11">R</text><text x="67.5" y="11">P</text>
        <text x="7.5" y="25">P</text><text x="22.5" y="25">U</text><text x="37.5" y="25">B</text><text x="52.5" y="25">O</text><text x="67.5" y="25">R</text>
        <text x="7.5" y="39">P</text><text x="22.5" y="39">U</text><text x="37.5" y="39">Z</text><text x="52.5" y="39">E</text><text x="67.5" y="39">L</text>
        <text x="7.5" y="53">A</text><text x="22.5" y="53">U</text><text x="37.5" y="53">E</text><text x="52.5" y="53">L</text><text x="67.5" y="53">L</text>
        <text x="7.5" y="67">N</text><text x="22.5" y="67">Z</text><text x="37.5" y="67">L</text><text x="52.5" y="67">L</text><text x="67.5" y="67">E</text>
      </g>
    </g>

    <!-- LEFT: Magnifying Glass -->
    <g id="magnifying-glass" transform="translate(224, 524)" filter="url(#neonGlowIntense)">
      <circle cx="30" cy="30" r="22" fill="#011224" stroke="#00F0FF" stroke-width="5.5"/>
      <circle cx="30" cy="30" r="15" fill="#00F0FF" fill-opacity="0.2"/>
      <path d="M 20 22 A 14 14 0 0 1 37 18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="45" y1="45" x2="66" y2="66" stroke="#00F0FF" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- LETTERS 'D' and 'G' (3D Neon Emboss) -->
    <g id="letters-d-g" filter="url(#neonGlowIntense)">
      <!-- Letter 'D' -->
      <path d="M 330 498
               H 386
               C 428 498, 452 522, 452 558
               C 452 594, 428 618, 386 618
               H 330
               V 498 Z
               M 358 522
               V 594
               H 382
               C 408 594, 423 580, 423 558
               C 423 536, 408 522, 382 522
               H 358 Z"
            fill="url(#letter3DGrad)"
            stroke="#00F0FF"
            stroke-width="5"
            stroke-linejoin="round" />

      <!-- Letter 'G' -->
      <path d="M 570 530
               C 556 510, 536 498, 508 498
               C 468 498, 442 526, 442 560
               C 442 594, 468 618, 508 618
               C 544 618, 568 598, 570 564
               H 514
               V 542
               H 592
               V 566
               C 588 614, 554 642, 508 642
               C 452 642, 414 604, 414 558
               C 414 512, 452 474, 508 474
               C 546 474, 576 492, 594 518
               L 570 530 Z"
            fill="url(#letter3DGrad)"
            stroke="#00F0FF"
            stroke-width="5"
            stroke-linejoin="round" />
    </g>

    <!-- CENTER: Subtle 'i' / Question Mark Glow Dot -->
    <g id="center-accent-dot" filter="url(#neonGlowIntense)">
      <path d="M 436 494
               C 436 472, 464 472, 464 494
               C 464 514, 450 518, 450 534"
            fill="none"
            stroke="#00F0FF"
            stroke-width="5"
            stroke-linecap="round"/>
      <circle cx="450" cy="548" r="4.5" fill="#FFFFFF" stroke="#00F0FF" stroke-width="2"/>
    </g>

    <!-- BOTTOM-CENTER: Glowing Open Book -->
    <g id="open-book-icon" transform="translate(422, 608)" filter="url(#neonGlowIntense)">
      <path d="M 28 28 C 20 22, 10 20, 0 22 V 40 C 10 38, 20 40, 28 46 Z" fill="#031a33" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round" />
      <path d="M 28 28 C 36 22, 46 20, 56 22 V 40 C 46 38, 36 40, 28 46 Z" fill="#031a33" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round" />
      <line x1="28" y1="26" x2="28" y2="46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 6 27 C 12 26, 18 27, 23 30" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 6 33 C 12 32, 18 33, 23 36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 33 30 C 38 27, 44 26, 50 27" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 33 36 C 38 33, 44 32, 50 33" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </g>

  </g>
</svg>
