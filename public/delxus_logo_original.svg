<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background & base glow -->
    <radialGradient id="delxusAura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4a0408" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#140203" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Fiery primary gradient -->
    <linearGradient id="flameGradPrimary" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="25%" stop-color="#EE1D24"/>
      <stop offset="65%" stop-color="#D0121A"/>
      <stop offset="100%" stop-color="#8B080E"/>
    </linearGradient>

    <!-- Fiery top wing highlight -->
    <linearGradient id="flameGradTopWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A4E"/>
      <stop offset="40%" stop-color="#ED1E24"/>
      <stop offset="100%" stop-color="#A50C13"/>
    </linearGradient>

    <!-- Deep shadow crimson for inner wing layers -->
    <linearGradient id="flameGradShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9C0A10"/>
      <stop offset="100%" stop-color="#550307"/>
    </linearGradient>

    <!-- Spiral vortex gradient -->
    <radialGradient id="vortexGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF5244"/>
      <stop offset="40%" stop-color="#E51920"/>
      <stop offset="80%" stop-color="#A00D14"/>
      <stop offset="100%" stop-color="#680408"/>
    </radialGradient>
  </defs>

  <!-- Pure Jet Black Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Subtle dark red ambiance -->
  <circle cx="256" cy="230" r="220" fill="url(#delxusAura)"/>

  <!-- EMBLEM: Stylized Fiery Wing & Dragon "D" -->
  <g id="delxus-emblem" transform="translate(2, -8)">
    <!-- Main fiery vertical stem with brush feather edges -->
    <path d="M 194 175 
             C 190 200, 185 240, 181 290 
             C 178 312, 175 328, 173 338 
             C 176 341, 180 340, 184 330 
             C 187 337, 190 338, 193 328 
             C 196 336, 201 334, 205 322 
             C 212 280, 216 230, 220 176 
             C 210 173, 200 174, 194 175 Z" 
          fill="url(#flameGradPrimary)"/>

    <!-- Stem highlights / striations -->
    <path d="M 197 185 
             C 192 215, 188 260, 186 315 
             C 190 310, 193 295, 196 265 
             C 200 230, 204 195, 207 180 Z" 
          fill="#FF4A42" opacity="0.75"/>

    <!-- TOP WING / PLUME LAYERS (Sweeping dynamic crest) -->
    <!-- Background upper wing feather 3 -->
    <path d="M 200 175 
             C 225 155, 260 138, 305 142 
             C 345 145, 385 168, 410 185 
             C 385 186, 360 178, 335 174 
             C 355 180, 380 190, 400 205 
             C 375 204, 350 198, 330 192 
             C 305 185, 270 180, 230 182 Z" 
          fill="url(#flameGradShadow)"/>

    <!-- Upper main sweeping flame plume 1 (Topmost sharp wing tip) -->
    <path d="M 135 182 
             C 160 162, 195 130, 245 112 
             C 290 96, 340 108, 375 138 
             C 345 134, 310 135, 280 145 
             C 310 146, 340 156, 365 174 
             C 330 168, 290 168, 255 175 
             C 210 184, 170 190, 135 182 Z" 
          fill="url(#flameGradTopWing)"/>

    <!-- Secondary sharp wing feathers pointing right -->
    <path d="M 215 155 
             C 265 140, 325 145, 375 170 
             C 395 180, 412 195, 418 200 
             C 400 198, 375 190, 350 185 
             C 370 192, 395 205, 405 218 
             C 375 212, 345 205, 315 202 
             C 270 198, 240 195, 215 198 Z" 
          fill="url(#flameGradPrimary)"/>

    <!-- OUTER BOWL OF THE "D" (Curving main flame body) -->
    <path d="M 205 322 
             C 230 334, 270 338, 305 325 
             C 335 312, 355 285, 350 250 
             C 358 268, 358 290, 345 310 
             C 362 300, 378 285, 395 265 
             C 382 285, 365 305, 342 320 
             C 310 342, 260 348, 205 334 
             Z" 
          fill="url(#flameGradPrimary)"/>

    <!-- Sharp lower winglet / flame spur pointing upward-right -->
    <path d="M 330 295 
             C 350 280, 375 260, 396 230 
             C 385 255, 365 282, 345 298 
             C 365 290, 385 275, 400 255 
             C 390 278, 368 305, 338 318 
             Z" 
          fill="url(#flameGradTopWing)"/>

    <!-- INNER SWIRLING VORTEX SPIRAL (The signature inner fire curl) -->
    <path d="M 235 235 
             C 240 205, 275 200, 300 215 
             C 325 230, 328 265, 310 285 
             C 290 305, 255 305, 235 285 
             C 220 270, 222 245, 238 232 
             C 252 220, 272 225, 280 238 
             C 288 250, 282 265, 270 270 
             C 260 274, 250 268, 248 258 
             C 246 250, 252 244, 258 245 
             C 264 246, 265 252, 262 256 
             C 256 260, 252 254, 254 250 
             C 252 245, 242 250, 242 260 
             C 242 274, 260 282, 274 274 
             C 290 264, 292 242, 278 226 
             C 262 210, 235 214, 224 235 
             C 214 255, 218 285, 240 302 
             C 268 322, 310 318, 332 290 
             C 352 262, 345 220, 315 198 
             C 282 175, 235 185, 218 215 
             Z" 
          fill="url(#vortexGrad)"/>

    <!-- Center swirling ember core highlight -->
    <path d="M 252 238 
             C 265 230, 280 236, 284 250 
             C 288 262, 278 274, 266 274 
             C 255 274, 246 264, 248 252 
             C 250 242, 258 238, 264 242 
             C 270 246, 268 255, 262 258 
             C 258 260, 255 255, 256 250 
             C 258 246, 264 248, 262 252 
             Z" 
          fill="#FF6B5E"/>
  </g>

  <!-- TYPOGRAPHY: "Delxus" in official scarlet red -->
  <g id="delxus-text" transform="translate(0, 420)">
    <text x="256" y="0" 
          text-anchor="middle" 
          fill="#E5232A" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="68" 
          font-weight="500" 
          letter-spacing="2px">Delxus</text>
  </g>
</svg>
